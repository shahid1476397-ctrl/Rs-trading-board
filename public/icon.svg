<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#006699" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#030712" rx="100"/>
  
  <!-- Outer Tactical Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f3ff" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.4"/>

  <!-- Core Outer Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#arcGlow)" opacity="0.4"/>

  <!-- Arc Reactor Coil Segments -->
  <g stroke="#00f3ff" stroke-width="12" fill="none" stroke-linecap="round">
    <line x1="256" y1="90" x2="256" y2="135"/>
    <line x1="256" y1="377" x2="256" y2="422"/>
    <line x1="90" y1="256" x2="135" y2="256"/>
    <line x1="377" y1="256" x2="422" y2="256"/>
    <line x1="138" y1="138" x2="170" y2="170"/>
    <line x1="342" y1="342" x2="374" y2="374"/>
    <line x1="374" y1="138" x2="342" y2="170"/>
    <line x1="138" y1="374" x2="170" y2="342"/>
  </g>

  <!-- Central Arc Ring -->
  <circle cx="256" cy="256" r="110" fill="#051923" stroke="#00f3ff" stroke-width="14"/>
  <circle cx="256" cy="256" r="80" fill="#001824" stroke="#38bdf8" stroke-width="8"/>
  
  <!-- Center Core Triangle / Mark LV Monogram -->
  <polygon points="256,190 310,290 202,290" fill="#00f3ff" opacity="0.9"/>
  <polygon points="256,215 290,280 222,280" fill="#030712"/>

  <!-- Center Text -->
  <text x="256" y="260" font-family="monospace, sans-serif" font-size="28" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="2">LV</text>
</svg>
